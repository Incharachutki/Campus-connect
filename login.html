<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Campus Connect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="login-icon">
                🔐
            </div>

            <h1>Admin Login</h1>

            <p class="login-subtitle">
                Login to manage Campus Connect
            </p>


            <!-- ERROR MESSAGE -->

            {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

            {% endif %}


            <!-- LOGIN FORM -->

            <form
                method="POST"
                action="{{ url_for('login') }}"
            >

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <a
                href="{{ url_for('home') }}"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
